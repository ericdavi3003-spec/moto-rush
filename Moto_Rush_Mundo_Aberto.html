{const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#4f8fe0');g.addColorStop(.7,'#a9d0f5');g.addColorStop(1,'#d8e8f5');x.fillStyle=g;x.fillRect(0,0,2,256);sc.background=new THREE.CanvasTexture(c)}

function li(x,z){
  const i=Math.round(x/60),j=Math.round(z/60);
  return Math.abs(x-60*i)<=Math.abs(z-60*j)?{v:true,c:Math.max(-240,Math.min(240,60*i))}:{v:false,c:Math.max(-240,Math.min(240,60*j))};
}
function gpsRoute(ax,az,tx,tz){
  const A=li(ax,az),B=li(tx,tz),p=[[ax,az]];
  if(A.v){
    p.push([A.c,az]);
    if(B.v){
      if(A.c!==B.c){const r=Math.max(-240,Math.min(240,60*Math.round((az+tz)/120)));p.push([A.c,r],[B.c,r])}
      p.push([B.c,tz]);
    }else p.push([A.c,B.c],[tx,B.c]);
  }else{
    p.push([ax,A.c]);
    if(!B.v){
      if(A.c!==B.c){const c=Math.max(-240,Math.min(240,60*Math.round((ax+tx)/120)));p.push([c,A.c],[c,B.c])}
      p.push([tx,B.c]);
    }else p.push([B.c,A.c],[B.c,tz]);
  }
  p.push([tx,tz]);
  return p;
}
